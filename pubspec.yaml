name: arab_lugat
description: Arab tili lug'atlarini o'rgatuvchi Flutter ilova
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase (Storage ni hozircha o'chirish)
  firebase_core: ^3.5.0
  cloud_firestore: ^5.5.0
  firebase_analytics: ^11.6.0
  firebase_auth: ^5.3.0


  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio Player
  just_audio: ^0.9.36

  # UI & Fonts
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

  # Utilities
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  # Assets uchun folder yaratilganda qo'shamiz
  # assets:
  #   - assets/images/
  #   - assets/audio/