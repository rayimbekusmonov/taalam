name: taalam
description: Arab tili lug'atlarini o'rgatuvchi Flutter ilova
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_analytics: ^10.7.4

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio Player
  just_audio: ^0.9.36

  # UI & Fonts
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

  # Utilities
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/